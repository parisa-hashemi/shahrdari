/* ---------- 41. proposal route dispatch ---------- */
function ProposalRoute(id,tab){
  const p=prop(id);
  if(!p) return {p:Shell(State('search','پیشنهاد یافت نشد','شناسه پیشنهاد معتبر نیست.',`<a class="btn btn-pri" href="#/proposals">فهرست پیشنهادها</a>`))};
  let body,step;
  if(tab==='impact'){body=PropImpact(id);step=2;}
  else if(tab==='comparison'){body=PropComparison(id);step=4;}
  else if(tab==='map'){body=PropMap(id);step=2;}
  else if(tab==='findings'){body=PropFindings(id);step=3;}
  else if(tab==='evidence'){body=PropEvidence(id);step=4;}
  else if(tab==='decision'){body=PropDecision(id);step=5;}
  else {body=PropOverview(id);step=anDone(id)?2:1;}
  return {p:PropShell(id,tab||'',body,step),b:()=>{
    bindRows();
    els('[data-imp]').forEach(n=>n.onclick=e=>{e.stopPropagation();impDrawer(n.dataset.imp,id);});
    els('[data-area]').forEach(n=>n.onclick=()=>areaDrawer(n.dataset.area,id));
    els('[data-layer]').forEach(n=>n.onclick=()=>{STATE.pmap.layer=n.dataset.layer;render();});
    els('[data-cmp]').forEach(n=>n.onclick=()=>{STATE.cmp.view=n.dataset.cmp;render();});
    els('[data-act="pcopilot"]').forEach(n=>n.onclick=()=>proposalCopilot(id));
    ['#pr-run','#pr-run2'].forEach(s=>{const n=el(s); if(n) n.onclick=()=>startAnalysis(id);});
    if(tab==='decision') bindDecision(id);
  }};
}

function shapeSVG(s,attrs){
  if(s.t==='rect') return `<rect x="${s.x}" y="${s.y}" width="${s.w}" height="${s.h}" ${attrs}/>`;
  if(s.t==='circle') return `<circle cx="${s.cx}" cy="${s.cy}" r="${s.r}" ${attrs}/>`;
  if(s.t==='rects') return s.list.map(r=>`<rect x="${r[0]}" y="${r[1]}" width="${r[2]}" height="${r[3]}" ${attrs}/>`).join('');
  if(s.t==='ring') return `<path d="M${s.x} ${s.y} H${s.x+s.w} V${s.y+s.h} H${s.x} Z M${s.ix} ${s.iy} V${s.iy+s.ih} H${s.ix+s.iw} V${s.iy} Z" fill-rule="evenodd" ${attrs}/>`;
  return '';
}

    for(let i=0;i<n;i++){
      const pw=8+rnd()*14,ph=7+rnd()*18;
      const px=bx+3+rnd()*(64-pw-6), py=by+3+rnd()*(50-ph-6);
      const inside=layer!=='existing'&&px>PROPGEO.x&&px<PROPGEO.x+PROPGEO.w&&py>PROPGEO.y&&py<PROPGEO.y+PROPGEO.h;
      blocks+=`<rect x="${px}" y="${py}" width="${pw}" height="${ph}"
        fill="${inside?'#0B5A63':'#C9D5DF'}" fill-opacity="${inside?.38:1}" stroke="${inside?'#0B5A63':'#AFBCC9'}" stroke-width=".7"/>`;
    }
  }
  const roads=`<g stroke="#FFFFFF" stroke-width="10"><path d="M0 104h620M0 174h620M0 244h620M0 314h620M104 0v420M186 0v420M268 0v420M350 0v420M432 0v420M514 0v420"/></g>
    <g stroke="#C3CEDA" stroke-width="1"><path d="M0 104h620M0 174h620M0 244h620M0 314h620M104 0v420M186 0v420M268 0v420M350 0v420M432 0v420M514 0v420"/></g>`;
  const d=idom(domKey);
  let eff='';
  if((layer==='impacts'||layer==='diff')&&d&&!d.undetermined){
    eff=d.areas.map(a=>{
      const c=AKIND[a.kind].c;
      const dash=a.kind==='indirect'?'stroke-dasharray="8 5"':a.kind==='unknown'?'stroke-dasharray="2 4"':'';
      const op=a.kind==='direct'?.20:a.kind==='indirect'?.11:.07;
      return `<g class="marea" data-iarea="${a.id}" style="cursor:pointer">
        ${shapeSVG(a.s,`fill="${c}" fill-opacity="${op}" stroke="${c}" stroke-width="${a.kind==='direct'?2.2:1.7}" ${dash}`)}
        ${a.s.t==='rect'?`<text x="${a.s.x+a.s.w-6}" y="${a.s.y+15}" font-size="10" fill="${c}" text-anchor="end" font-family="IBM Plex Mono,monospace">${a.id}</text>`:''}
        ${a.s.t==='circle'?`<text x="${a.s.cx+a.s.r-8}" y="${a.s.cy-a.s.r+16}" font-size="10" fill="${c}" text-anchor="end" font-family="IBM Plex Mono,monospace">${a.id}</text>`:''}
      </g>`;}).join('');
  }
  const P=PROPGEO;
  const boundary=`<g pointer-events="none">
    <rect x="${P.x}" y="${P.y}" width="${P.w}" height="${P.h}" fill="#5B44D6" fill-opacity=".05" stroke="#5B44D6" stroke-width="2.6"/>
    <rect x="${P.x-4}" y="${P.y-4}" width="${P.w+8}" height="${P.h+8}" fill="none" stroke="#5B44D6" stroke-opacity=".35" stroke-width="1"/>
    <rect x="${P.x+4}" y="${P.y-13}" width="118" height="20" rx="3" fill="#5B44D6"/>
    <text x="${P.x+114}" y="${P.y+1}" font-size="12" fill="#fff" direction="rtl" font-family="Vazirmatn,Tahoma">محدوده پیشنهاد</text></g>`;
  return `<svg viewBox="0 0 620 420" width="100%" style="display:block;border-radius:var(--r-m);background:#F8FAFB">
    ${blocks}${roads}${eff}${layer==='existing'?'':boundary}</svg>`;
}

/* ---- route dispatch (adds impact-domain binding) ---- */
function ProposalRoute(id,tab){
  const p=prop(id);
  if(!p) return {p:Shell(State('search','پیشنهاد یافت نشد','شناسه پیشنهاد معتبر نیست.',`<a class="btn btn-pri" href="#/proposals">فهرست پیشنهادها</a>`))};
  const isAnDone = anDone(id);
  let body,step;
  if(tab==='impact'){body=PropImpact(id);step=2;}
  else if(tab==='comparison'){body=PropComparison(id);step=4;}
  else if(tab==='map'){body=PropMap(id);step=2;}
  else if(tab==='findings'){body=PropFindings(id);step=3;}
  else if(tab==='evidence'){body=PropEvidence(id);step=4;}
  else if(tab==='decision'){body=PropDecision(id);step=5;}
  else {body=PropOverview(id);step=isAnDone?2:1;}
  return {p:PropShell(id,tab||'',body,step),b:()=>{
    bindRows();
    els('[data-imp]').forEach(n=>n.onclick=e=>{e.stopPropagation();impDrawer(n.dataset.imp,id);});
    els('[data-iarea]').forEach(n=>n.onclick=()=>areaDrawer(n.dataset.iarea,id));
    els('[data-idom]').forEach(n=>n.onclick=()=>{STATE.pmap.dom=n.dataset.idom; if(STATE.pmap.layer!=='impacts'&&STATE.pmap.layer!=='diff') STATE.pmap.layer='impacts'; render();});
    els('[data-layer]').forEach(n=>n.onclick=()=>{STATE.pmap.layer=n.dataset.layer;render();});
    els('[data-cmp]').forEach(n=>n.onclick=()=>{STATE.cmp.view=n.dataset.cmp;render();});
    els('[data-act="pcopilot"]').forEach(n=>n.onclick=()=>proposalCopilot(id));
    ['#pr-run','#pr-run2'].forEach(s=>{const n=el(s); if(n) n.onclick=()=>startAnalysis(id);});
    const bvb = el('#btn-prop-view-blockers');
    if (bvb) {
      bvb.onclick = () => {
        const scData = (window.getLocalStudyCaseByProposal && window.getLocalStudyCaseByProposal(id)) || null;
        if (scData && window.openBlockersDrawer) {
          window.openBlockersDrawer(scData.studyCase.id, scData.blockers, scData.studyCase, scData.requests);
        }
      };
    }
    if(tab==='decision') bindDecision(id);
  }};
}

/* ---------- 44. storage shim (never throws in sandboxed frames) ---------- */
const MEMSTORE={};
const SAFE={
  ok:(()=>{try{const k='__t';localStorage.setItem(k,'1');localStorage.removeItem(k);return true;}catch(e){return false;}})(),
  get(k){try{return this.ok?localStorage.getItem(k):(MEMSTORE[k]??null);}catch(e){return MEMSTORE[k]??null;}},
  set(k,v){try{this.ok?localStorage.setItem(k,v):(MEMSTORE[k]=v);}catch(e){MEMSTORE[k]=v;}},
  del(k){try{this.ok?localStorage.removeItem(k):delete MEMSTORE[k];}catch(e){delete MEMSTORE[k];}}
};

/* ---------- 47. id / event helpers ---------- */
function nid(p){ DB.seq[p]=(DB.seq[p]||0)+1; return p+'-'+String(DB.seq[p]).padStart(3,'0'); }
function clock(){ const d=new Date(); return NOW+'، '+fa(String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0')); }
function logAct(o){
  const a=Object.assign({id:nid('AC'),tm:clock(),actor:ME()||'سامانه',k:'ok'},o);
  DB.activities.unshift(a); return a;
}
function notify(o){
  if(!o.to||o.to===ME()&&o.self!==true) { if(!o.to) return null; }
  const n=Object.assign({id:nid('NT'),tm:clock(),read:false,type:'ok'},o);
  DB.notifications.unshift(n); return n;
}
function sendMessage(o){ const m=Object.assign({id:nid('MS'),tm:clock(),read:false,from:ME()},o); DB.messages.unshift(m); saveDB(); return m; }

/* ---------- 48. selectors ---------- */
const actFor=(et,eid)=>DB.activities.filter(a=>a.et===et&&a.eid===eid);
const myNotifs=()=>DB.notifications.filter(n=>n.to===ME());

const myMessages=()=>DB.messages.filter(m=>m.to===ME());

    break;}

  case 'PUBLISH_DATASET_VERSION':{
    const d=ds(p.code), v=dsVer(d,p.v);
    d.versions.filter(x=>x.st==='published').forEach(x=>{x.st='superseded';});
    v.st='published'; v.pub=NOW;
    logAct({action:'PUBLISH_DATASET_VERSION',et:'dataset',eid:d.code,etitle:d.title,from:'ready',to:'published',
      text:`نسخه v${fa(v.v)} داده «${d.title}» منتشر شد`,k:'ok'});
    (d.uses||[]).forEach(sid=>{
      const s=byId(sid); if(!s) return;
      DB.stale[sid]=(DB.stale[sid]||[]).filter(x=>x.code!==d.code);
      DB.stale[sid].push({code:d.code,title:d.title,v:v.v,tm:NOW});
      logAct({action:'DATA_VERSION_AVAILABLE',et:'study',eid:sid,etitle:s.name,
        text:`نسخه جدید داده «${d.title}» (v${fa(v.v)}) برای این مطالعه در دسترس است؛ نتایج فعلی نیازمند بررسی اثر است`,k:'warn'});
      notify({to:s.owner,self:true,type:'warn',title:'نسخه جدید داده برای مطالعه شما منتشر شد',
        msg:`${d.title} v${fa(v.v)} — تحلیل‌های وابسته «نیازمند بررسی» علامت خوردند`,
        route:'#/study/'+sid+'/data',et:'study',eid:sid});
      propsOf(sid).forEach(pr=>{ const a=anState(pr.id); if(a.done){ a.stale=true;
        logAct({action:'ANALYSIS_STALE',et:'proposal',eid:pr.id,etitle:pr.t,
          text:`نتایج تحلیل به‌دلیل انتشار نسخه v${fa(v.v)} داده «${d.title}» کهنه شد؛ اجرای قبلی به نسخه اصلی خود متصل می‌ماند`,k:'warn'});
        if(pr.owner!==me) notify({to:pr.owner,type:'warn',title:'نتایج تحلیل پیشنهاد کهنه شد',
          msg:`${pr.t} — نسخه ورودی تغییر کرده است`,route:'#/proposal/'+pr.id,et:'proposal',eid:pr.id}); } });
    });
    break;}

  case 'QUARANTINE_DATASET':{
    const d=ds(p.code), v=dsVer(d,p.v); v.st='quarantined';
    logAct({action:'QUARANTINE_DATASET',et:'dataset',eid:d.code,etitle:d.title,to:'quarantined',
      text:`نسخه v${fa(v.v)} داده «${d.title}» به قرنطینه رفت`,k:'stop'});
    notify({to:d.owner,self:true,type:'stop',title:'نسخه داده به قرنطینه رفت',msg:d.title,
      route:'#/data/'+d.code+'/quality',et:'dataset',eid:d.code});
    break;}

  case 'COMPLETE_TASK':{
    const t=DB.tasks.find(x=>x.id===p.id); if(!t) break; const from=t.st; t.st='done';
    logAct({action:'COMPLETE_TASK',et:'task',eid:t.id,etitle:t.t,from,to:'done',text:`وظیفه «${t.t}» تکمیل شد`,k:'ok'});
    break;}

  case 'ASSIGN_TASK':{
    const t={id:nid('TS'),t:p.t,studyId:p.studyId,proposalId:p.proposalId,assignee:p.assignee,st:'todo',due:p.due||'۱۴۰۵/۰۷/۱۵'};
    DB.tasks.unshift(t);
    logAct({action:'ASSIGN_TASK',et:'task',eid:t.id,etitle:t.t,to:p.assignee,text:`وظیفه «${t.t}» به ${p.assignee} واگذار شد`,k:'ok'});
    notify({to:p.assignee,type:'ok',title:'وظیفه تازه‌ای به شما واگذار شد',msg:t.t,
      route:p.studyId?'#/study/'+p.studyId:'#/proposal/'+p.proposalId,et:'task',eid:t.id});
    break;}

  case 'SIGN_CHAPTER_ZERO':{
    const s=byId(p.id); const cs=czState(p.id);
    cs.signed=me;
    cs.sealed=true;
    if(!cs.snapshots) cs.snapshots=[];
    cs.snapshots.unshift({id:'CZ-'+nid('AC').slice(3),ok:10,total:10,by:me,tm:clock()});
    if(!cs.over) cs.over={};
    try {
      const allR = czAll(p.id);
      allR.forEach(r => {
        cs.over[r.cat+':'+r.k] = Object.assign({}, r, {
          blocking: false,
          st: 'ready',
          issue: '',
          impact: 'توسط تحلیلگر شهری امضا و به تصویر تغییرناپذیر متصل شد.'
        });
      });
    } catch(e){}
    if(s){
      s.stage=Math.max(s.stage||1,3);
      s.prog=Math.max(s.prog||0,60);
      s.updated=NOW;
      s.status='ready';
      s.next='اجرای ماژول‌های ۱۲گانه مطالعه و تدوین گزارش رسمی';
      s.nextHref='#/study/'+p.id;
    }
    const sc = (window.DB?.studyCases || []).find(c => c.study_id === p.id);
    if(sc){
      sc.status = 'READY_FOR_NEXT_STEP';
      sc.workflow_step = Math.max(sc.workflow_step || 1, 5);
      if(!sc.baseline) sc.baseline = { status: 'READY', pinned_datasets: {} };
      sc.baseline.status = 'READY';
      sc.updated_at = NOW;
    }
    logAct({action:'SIGN_CHAPTER_ZERO',et:'study',eid:p.id,etitle:s?s.name:p.id,to:'signed',
      text:`فصل صفر مطالعه «${s?s.name:p.id}» توسط تحلیلگر شهری امضا و تصویر تغییرناپذیر ثبت شد`,k:'ok'});
    break;}

  case 'RECORD_ASSUMPTION':{
    const s=byId(p.id);
    logAct({action:'RECORD_ASSUMPTION',et:'study',eid:p.id,etitle:s.name,
      text:`فرض مستند برای «${p.row}» ثبت شد؛ وضعیت وابستگی به «دارای محدودیت» تغییر کرد`,k:'warn'});
    break;}

  case 'MARK_NOTIFICATION_READ':{
    if(p.all) myNotifs().forEach(n=>n.read=true);
    else { const n=DB.notifications.find(x=>x.id===p.id); if(n) n.read=true; }
    break;}

  case 'MARK_MESSAGE_READ':{
    const m=DB.messages.find(x=>x.id===p.id); if(m) m.read=true; break;}

  case 'SEND_MESSAGE':{
    const m=sendMessage(p);
    logAct({action:'SEND_MESSAGE',et:p.et||'message',eid:p.eid||m.id,etitle:p.etitle||'پیام داخلی',
      text:`پیام داخلی به ${p.to} ارسال شد`,k:'ok'});
    notify({to:p.to,type:'ok',title:'پیام داخلی تازه',msg:p.text.slice(0,70),route:'#/messages',et:'message',eid:m.id});
    out=m; break;}

  default: console.warn('unknown action',type);
  }
  saveDB();
  return out;
}

/* ---------- 50. state-backed working state ---------- */
function czState(id){
  if(!DB.chapterZero[id]) DB.chapterZero[id]={over:{},assumptions:[],signed:null,snapshots:[],filter:'all',cat:'all'};
  return DB.chapterZero[id];
}
function anState(id){
  if(!DB.analyses[id]){
    const p=prop(id);
    DB.analyses[id]={stage:-1,done:!!(p&&p.status==='partial'),ver:p?p.ver:'v1',notes:[],reco:null,submitted:false,
      runId:'RUN-'+fa(4510+(p?DB.proposals.indexOf(p):0)),at:p&&p.status==='partial'?'۱۴۰۵/۰۶/۲۳، ۰۹:۴۱':null};
  }
  return DB.analyses[id];
}
function publishVersion(code,vn){ dispatch('PUBLISH_DATASET_VERSION',{code,v:vn}); }

/* ---------- 60. proposal review workflow card ---------- */
function ReviewFlowCard(id){
  const p=prop(id), a=anState(id), me=ME();
  const isOwner=p.owner===me&&can('SUBMIT_FOR_REVIEW'), isRev=can('REVIEW_PROPOSAL');
  const revs=DB.reviews.filter(r=>r.proposalId===id);
  const KIND={submit:['ارسال برای بررسی','b-run'],revision:['درخواست اصلاح','b-stop'],resubmit:['ارسال مجدد','b-run'],approve:['تأیید فنی','b-ok']};
  let actions='';
  if(a.stale) actions+=`<div class="notice n-warn" style="margin-bottom:8px">${ico.alert}<div>نتایج این تحلیل به‌دلیل انتشار نسخه جدید داده «نیازمند بررسی» است؛ پیش از ارسال برای بررسی، تحلیل را دوباره اجرا کنید.</div></div>`;
  if(['partial','assess','needevidence','decision'].includes(p.status)&&isOwner)
    actions+=`<button class="btn btn-pri" id="rf-submit" style="width:100%;justify-content:center">ارسال برای بررسی فنی</button>`;
  if(p.status==='inreview'&&isRev)
    actions+=`<div style="display:grid;gap:6px"><button class="btn btn-pri" id="rf-approve">تأیید بررسی فنی</button>
      <button class="btn btn-danger" id="rf-revise">ارجاع برای اصلاح</button></div>`;
  if(p.status==='inreview'&&!isRev)
    actions+=`<p class="muted" style="font-size:12px">بسته در انتظار بررسی فنی است. اقدام بعدی با بررسی‌کننده است.</p>`;
  if(p.status==='revise'&&isOwner)
    actions+=`<button class="btn btn-pri" id="rf-resubmit" style="width:100%;justify-content:center">اصلاح شد — ارسال مجدد</button>`;
  if(p.status==='revise'&&!isOwner)
    actions+=`<p class="muted" style="font-size:12px">در انتظار اصلاح توسط مالک بسته (${p.owner}).</p>`;
  if(!actions) actions=`<p class="muted" style="font-size:12px">در وضعیت فعلی، اقدام بررسی در دسترس نیست. اقدام بعدی: ${p.next}</p>`;

const dispatchX=(type,p)=>{
  const me=ME();
  switch(type){
  case 'REGISTER_CASE':{
    const id='CS-1405-0'+String(DB.cases.length+48).padStart(2,'0');
    const c=Object.assign({id,reg:NOW,st:'new',owner:null,letters:[]},p);
    DB.cases.unshift(c);
    logAct({action:'REGISTER_CASE',et:'case',eid:id,etitle:c.t,to:'new',text:`پرونده «${c.t}» در دبیرخانه ثبت شد`,k:'ok'});
    saveDB(); return c;}
  case 'ASSIGN_CASE':{
    const c=DB.cases.find(x=>x.id===p.id); const from=c.st; c.owner=p.owner; c.st='assigned';
    logAct({action:'ASSIGN_CASE',et:'case',eid:c.id,etitle:c.t,from,to:'assigned',
      text:`پرونده «${c.t}» به ${p.owner} ارجاع شد`,k:'ok'});
    DB.tasks.unshift({id:nid('TS'),t:'بررسی پرونده ارجاع‌شده «'+c.t+'»',studyId:c.studyId,assignee:p.owner,st:'todo',due:c.due});
    notify({to:p.owner,type:'ok',title:'پرونده تازه‌ای به شما ارجاع شد',msg:c.t,route:c.studyId?'#/study/'+c.studyId:'#/cases',et:'case',eid:c.id});
    saveDB(); return c;}
  case 'LOG_CORRESPONDENCE':{
    const c=DB.cases.find(x=>x.id===p.id);
    c.letters.unshift({tm:NOW,t:p.text,by:me});
    logAct({action:'LOG_CORRESPONDENCE',et:'case',eid:c.id,etitle:c.t,text:`مکاتبه ثبت شد: ${p.text}`,k:'ok'});
    saveDB(); return c;}
  case 'PREPARE_REFERRAL':{
    const c=DB.cases.find(x=>x.id===p.id); const from=c.st; c.st='ready';
    logAct({action:'PREPARE_REFERRAL',et:'case',eid:c.id,etitle:c.t,from,to:'ready',
      text:`بسته ارجاع رسمی پرونده «${c.t}» آماده شد`,k:'ok'});
    usersByRole('approver').forEach(u=>notify({to:u,type:'ok',title:'پرونده آماده ارجاع رسمی است',msg:c.t,
      route:'#/decisions',et:'case',eid:c.id}));
    saveDB(); return c;}
  case 'SUBMIT_FINDING':{
    const f={id:nid('FD'),by:me,studyId:p.studyId,topic:p.topic,tm:NOW,st:'submitted',t:p.t};
    DB.findings.unshift(f);
    const s=byId(p.studyId);
    logAct({action:'SUBMIT_FINDING',et:'study',eid:p.studyId,etitle:s?s.name:p.studyId,to:'submitted',
      text:`یافته کارشناسی مشاور در موضوع «${p.topic}» ثبت شد`,k:'ok'});
    if(s&&s.owner!==me) notify({to:s.owner,type:'ok',title:'یافته کارشناسی تازه‌ای ثبت شد',
      msg:`${p.topic} — ${f.t.slice(0,60)}`,route:'#/study/'+p.studyId+'/history',et:'study',eid:p.studyId});
    usersByRole('reviewer').slice(0,1).forEach(u=>notify({to:u,type:'ok',title:'یافته مشاور برای بازبینی در دسترس است',
      msg:p.topic,route:'#/findings',et:'study',eid:p.studyId}));
    saveDB(); return f;}
  case 'DECIDE_ACCESS':{
    const r=DB.accessRequests.find(x=>x.id===p.id); r.st=p.ok?'approved':'rejected'; r.by=me;
    logAct({action:p.ok?'APPROVE_ACCESS':'REJECT_ACCESS',et:'access',eid:r.id,etitle:r.ask,to:r.st,
      text:`درخواست دسترسی ${r.by?'':''}«${r.ask}» برای ${r.by||''} ${p.ok?'تأیید':'رد'} شد`,k:p.ok?'ok':'stop'});
    notify({to:r.by,type:p.ok?'ok':'stop',title:p.ok?'درخواست دسترسی شما تأیید شد':'درخواست دسترسی شما رد شد',
      msg:r.ask,route:'#/',et:'access',eid:r.id});
    saveDB(); return r;}
  case 'RECORD_DECISION':{
    const pr=prop(p.id); const from=pr.status;
    DB.decisions.unshift({id:nid('DC'),proposalId:p.id,by:me,tm:clock(),kind:p.kind,note:p.note});
    if(p.kind==='info'){ pr.status='needevidence'; pr.next='تأمین اطلاعات درخواستی مقام تصمیم‌گیر'; }
    if(p.kind==='revise'){ pr.status='revise'; pr.next='اصلاح بر اساس نظر مقام تصمیم‌گیر'; }
    if(p.kind==='record'){ pr.next='ارجاع به فرآیند رسمی'; }
    pr.upd=NOW;
    logAct({action:'RECORD_DECISION',et:'proposal',eid:pr.id,etitle:pr.t,from,to:pr.status,
      text:`تصمیم مقام تصمیم‌گیر ثبت شد (${{info:'درخواست اطلاعات بیشتر',revise:'ارجاع برای اصلاح',record:'ثبت نظر در حدود اختیار'}[p.kind]}): ${p.note}`,k:'ok'});
    notify({to:pr.owner,type:'warn',title:'مقام تصمیم‌گیر نظر خود را ثبت کرد',msg:p.note,
      route:'#/proposal/'+pr.id+'/decision',et:'proposal',eid:pr.id});
    usersByRole('sec').forEach(u=>notify({to:u,type:'ok',title:'وضعیت پرونده تصمیم تغییر کرد',msg:pr.t,
      route:'#/cases',et:'proposal',eid:pr.id}));
    saveDB(); return pr;}
  }
};

function bindHome(){
  bindMyWork();
  els('[data-ar]').forEach(b=>b.onclick=()=>{dispatchX('DECIDE_ACCESS',{id:b.dataset.ar,ok:b.dataset.ok==='1'});
    render(); toast(b.dataset.ok==='1'?'دسترسی تأیید شد و به کاربر اعلان داده شد':'درخواست دسترسی رد شد و به کاربر اعلان داده شد');});
  const cn=el('#sc-new'); if(cn) cn.onclick=caseModal;
  els('[data-fulfil]').forEach(b=>b.onclick=()=>fulfilModal(b.dataset.fulfil));
  const cf=el('#cn-finding'); if(cf) cf.onclick=()=>findingModal();
  els('[data-fix]').forEach(b=>b.onclick=()=>findingModal(b.dataset.fix));
  els('[data-fdok]').forEach(b=>b.onclick=()=>{const f=DB.findings.find(x=>x.id===b.dataset.fdok); f.st='accepted';
    logAct({action:'ACCEPT_FINDING',et:'study',eid:f.studyId,etitle:f.topic,to:'accepted',text:`یافته مشاور «${f.topic}» پذیرفته شد`,k:'ok'});
    notify({to:f.by,type:'ok',title:'یافته کارشناسی شما پذیرفته شد',msg:f.topic,route:'#/findings',et:'study',eid:f.studyId});
    saveDB(); render(); toast('یافته پذیرفته شد و به مشاور اعلان داده شد');});
  els('[data-fdno]').forEach(b=>b.onclick=()=>{const f=DB.findings.find(x=>x.id===b.dataset.fdno); f.st='changes_requested';
    logAct({action:'REQUEST_FINDING_REVISION',et:'study',eid:f.studyId,etitle:f.topic,to:'changes_requested',
      text:`برای یافته مشاور «${f.topic}» درخواست اصلاح ثبت شد`,k:'warn'});
    notify({to:f.by,type:'warn',title:'برای یافته شما درخواست اصلاح ثبت شد',msg:f.topic,route:'#/findings',et:'study',eid:f.studyId});

}

    ${err ? `<div class="notice n-stop" style="margin-bottom:12px">${ico.alert}<div>${err}</div></div>` : ''}

    <div class="f-row"><label class="f-lbl" for="lg-role">گام ۱ — نقش سازمانی</label>
      <select class="f-in" id="lg-role">
        <option value="">— انتخاب نقش —</option>
        ${ROLES.map(r => `<option value="${r.id}" ${L.role === r.id ? 'selected' : ''}>${r.t} (${fa(USERS.filter(u => u.role === r.id).length)} کاربر)</option>`).join('')}
      </select>
      ${L.role ? `<p class="muted" style="font-size:11px;margin-top:5px">${(ROLES.find(r => r.id === L.role) || {}).d}</p>` : ''}
    </div>

    <div class="f-row"><label class="f-lbl">گام ۲ — کاربر</label>
      ${L.role ? `<div class="fld" style="width:100%;margin-bottom:7px">${ico.search}
          <input id="lg-q" placeholder="جست‌وجوی نام، سازمان یا شماره" value="${esc(L.q)}" style="width:100%"></div>
        <div class="pickbox">${list.length ? list.map(u => `<button class="pick ${L.phone === u.phone ? 'on' : ''}" data-pick="${u.phone}">
            <span class="av" style="width:24px;height:24px;font-size:10px">${initials(u.id)}</span>
            <span class="px"><b>${u.id}</b><span>${u.title} · ${u.org}</span></span>
            <span class="code">${u.phone}</span></button>`).join('')
          : `<div class="muted" style="padding:12px;font-size:12px;text-align:center">کاربری با این جست‌وجو در این نقش نیست</div>`}</div>`

    <div class="notice n-demo" style="margin-top:14px">${ico.lock}<div>

  return `<div class="login">
    <div class="pane">
      <div style="display:flex;gap:10px;align-items:center;margin-bottom:16px">${Mark(34)}

          <div class="muted" style="font-size:11.5px">درگاه یکپارچه تصمیم‌سازی و مشارکت علمی</div>
        </div>
      </div>

      <!-- Main role tabs -->
      <div style="display:flex;gap:4px;margin-bottom:18px;background:#EEF2F6;padding:4px;border-radius:var(--r-m)">
        <button type="button" class="btn btn-sm ${isSci ? 'btn-pri' : 'btn-ghost'}" id="login-tab-sci" style="flex:1;justify-content:center;font-size:12px">
          ${ico.spark} نهاد علمی و دانشگاهی
        </button>
        <button type="button" class="btn btn-sm ${!isSci ? 'btn-pri' : 'btn-ghost'}" id="login-tab-org" style="flex:1;justify-content:center;font-size:12px">
          ${ico.user} ورود سازمانی شهرداری
        </button>
      </div>

      ${isSci ? sciPane : orgPane}

      <div class="muted" style="font-size:11px;margin-top:14px">پشتیبانی سامانه: داخلی ۲۴۱۸ · مرکز مطالعات و برنامه‌ریزی شهر تهران</div>
    </div>
    <div class="art">${ArtSVG()}
      <div class="cap"><div><b>پهنه مرکزی منطقه ۶ — محدوده مطالعه نمونه</b>
        <span>مرز مطالعه، بلوک‌های شهری و پلاک‌ها؛ نمایش ساختگی</span></div>
        <span class="code">EPSG:32639</span></div></div>
  </div>`;
}

function bindLogin(){
  // Main role Tab toggles
  const tabSci = el('#login-tab-sci');
  if (tabSci) tabSci.onclick = () => { STATE.loginTab = 'scientific'; STATE.loginErr = null; STATE.unregisteredNotice = null; render(); };
  const tabOrg = el('#login-tab-org');
  if (tabOrg) tabOrg.onclick = () => { STATE.loginTab = 'org'; STATE.loginErr = null; STATE.unregisteredNotice = null; render(); };

  // Scientific Mode back-to-login
  const regBackTop = el('#reg-back-top');
  if (regBackTop) regBackTop.onclick = () => {
    STATE.sciAuthMode = 'login';
    STATE.loginErr = null;
    STATE.unregisteredNotice = null;
    render();
  };

  const linkNeedReg = el('#link-need-register');
  if (linkNeedReg) linkNeedReg.onclick = () => {
    STATE.sciAuthMode = 'register';
    STATE.loginErr = null;
    STATE.unregisteredNotice = null;
    render();
  };

  const btnSwitchReg = el('#btn-switch-to-register');
  if (btnSwitchReg) btnSwitchReg.onclick = () => {
    STATE.sciAuthMode = 'register';
    STATE.regPhone = STATE.unregisteredNotice || '';
    STATE.loginErr = null;
    STATE.unregisteredNotice = null;
    render();
  };

  const regCancel = el('#reg-cancel-btn');
  if (regCancel) regCancel.onclick = () => {
    STATE.sciAuthMode = 'login';
    STATE.loginErr = null;
    render();
  };

  // Fast demo fill button in registration form
  const regDemoFill = el('#reg-demo-fill');
  if (regDemoFill) regDemoFill.onclick = () => {
    const pIn = el('#reg-phone'); if (pIn) pIn.value = '09127778899';
    const fnIn = el('#reg-fname'); if (fnIn) fnIn.value = 'دکتر علیرضا';
    const lnIn = el('#reg-lname'); if (lnIn) lnIn.value = 'میرزایی';
    const nidIn = el('#reg-nid'); if (nidIn) nidIn.value = '0071829301';
    const uniIn = el('#reg-uni'); if (uniIn) uniIn.value = 'دانشگاه صنعتی امیرکبیر';
    const facIn = el('#reg-faculty'); if (facIn) facIn.value = 'دانشکده مهندسی عمران و محیط‌زیست';
    const profIn = el('#reg-profession'); if (profIn) profIn.value = 'دانشیار';
    const fieldIn = el('#reg-field'); if (fieldIn) fieldIn.value = 'برنامه‌ریزی حمل‌ونقل و سیستم‌های شهری';
    const emIn = el('#reg-email'); if (emIn) emIn.value = 'mirzaei@aut.ac.ir';
    toast('اطلاعات نمونه دانشگاهی درج شد؛ جهت تکمیل، دکمه فعال‌سازی حساب را بزنید.');
  };

  // Submit registration
  const regSubmitBtn = el('#reg-submit-btn');
  if (regSubmitBtn) regSubmitBtn.onclick = async () => {
    const phone = (el('#reg-phone')?.value || '').trim().replace(/[^\d+]/g, '');
    const fname = (el('#reg-fname')?.value || '').trim();
    const lname = (el('#reg-lname')?.value || '').trim();
    const nid = (el('#reg-nid')?.value || '').trim();
    const uni = (el('#reg-uni')?.value || '').trim();
    const faculty = (el('#reg-faculty')?.value || '').trim();
    const prof = (el('#reg-profession')?.value || '').trim();
    const field = (el('#reg-field')?.value || '').trim();
    const degree = (el('#reg-degree')?.value || '').trim();
    const email = (el('#reg-email')?.value || '').trim();

    if (!phone || phone.length < 10) {
      STATE.loginErr = 'شماره تلفن همراه معتبر ۱۱ رقمی الزامی است.';
      render(); return;
    }
    if (!fname || !lname) {
      STATE.loginErr = 'وارد نمودن نام و نام خانوادگی الزامی است.';
      render(); return;
    }
    if (!field) {
      STATE.loginErr = 'وارد نمودن رشته و گرایش تخصصی الزامی است.';
      render(); return;
    }

    regSubmitBtn.disabled = true;
    regSubmitBtn.innerHTML = `${ico.clock} در حال ثبت‌نام و فعال‌سازی...`;

    try {
      if (window.SCI && window.SCI.registerUser) {
        await window.SCI.registerUser({
          phone,
          first_name: fname,
          last_name: lname,
          national_id: nid,
          university_name: uni,
          faculty_group: faculty,
          profession_type: prof,
          field_of_study: field,
          academic_degree: degree,
          email
        });
      }

      const fullName = `${fname} ${lname}`;
      const newUser = {
        id: fullName,
        role: 'scientific',
        phone: phone,
        org: uni,
        title: `${prof} — ${field}`
      };

      if (!USERS.some(u => u.phone === phone)) {
        USERS.push(newUser);
      }

      STATE.otpPhone = phone;
      STATE.user = {
        name: fullName,
        role: 'scientific',
        phone: phone,
        org: uni,
        title: prof
      };
      save();

      toast(`ثبت‌نام شما با شماره ${fa(phone)} با موفقیت انجام شد! حساب کاربری فعال گردید.`);
      location.hash = '#/scientific';
      render();
    } catch (e) {
      console.error(e);
      STATE.loginErr = 'خطا در ثبت‌نام. لطفاً مجدداً تلاش فرمایید.';
      render();
    }
  };

  // Scientific OTP flow bindings (Login mode)
  const quickBtns = els('[data-quick-sci]');
  quickBtns.forEach(btn => {
    btn.onclick = () => {
      STATE.otpPhone = btn.dataset.quickSci;
      STATE.sciAuthMode = 'login';
      const phInput = el('#otp-phone-input');
      if (phInput) phInput.value = STATE.otpPhone;
      el('#otp-send-btn').click();
    };
  });

  const sendBtn = el('#otp-send-btn');
  if (sendBtn) {
    sendBtn.onclick = () => {
      const ph = (el('#otp-phone-input')?.value || '').trim().replace(/[^\d+]/g, '');
      if (!ph || ph.length < 10) {
        STATE.loginErr = 'لطفاً شماره تلفن همراه معتبر ۱۱ رقمی وارد نمایید.';
        STATE.unregisteredNotice = null;
        render();
        return;
      }

      // CRITICAL CHECK: Is this phone number registered in the scientific network?
      const isRegistered = window.SCI && window.SCI.isPhoneRegistered ?
        window.SCI.isPhoneRegistered(ph) :
        (USERS.some(u => u.phone === ph && u.role === 'scientific') || ph === '09123456789' || ph === '09121112233');

      if (!isRegistered) {
        // Stop right here! Do not allow OTP without prior registration
        STATE.unregisteredNotice = ph;
        STATE.regPhone = ph;
        STATE.loginErr = null;
        STATE.otpStep = 'phone';
        toast(`شماره ${fa(ph)} هنوز ثبت‌نام نشده است. لطفاً ابتدا ثبت‌نام کنید.`, false);
        render();
        return;
      }

      // Phone is registered -> proceed to OTP verification
      STATE.unregisteredNotice = null;
      STATE.otpPhone = ph;
      STATE.otpStep = 'verify';
      STATE.loginErr = null;
      toast(`کد تأیید ۶ رقمی به شماره ${fa(ph)} پیامک شد (کد نمونه: ۱۲۳۴۵۶)`);
      render();
    };
  }

  const resendBtn = el('#otp-resend-btn');
  if (resendBtn) {
    resendBtn.onclick = () => {
      toast(`کد جدید مجدداً به شماره ${fa(STATE.otpPhone)} ارسال شد (کد نمونه: ۱۲۳۴۵۶)`);
    };
  }

  const backBtn = el('#otp-back-btn');
  if (backBtn) {
    backBtn.onclick = () => {
      STATE.otpStep = 'phone';
      STATE.loginErr = null;
      STATE.unregisteredNotice = null;
      render();
    };
  }

  const verifyBtn = el('#otp-verify-btn');
  const codeIn = el('#otp-code-input');
  const verifySubmit = () => {
    const code = (el('#otp-code-input')?.value || '').trim();
    if (!code || code.length < 4) {
      STATE.loginErr = 'لطفاً کد ۶ رقمی معتبر وارد نمایید.';
      render();
      return;
    }

    const ph = STATE.otpPhone;
    let acc = accountBy(ph) || USERS.find(u => u.phone === ph);

    if (!acc) {
      // Safety fallback if not found in USERS
      acc = {
        id: 'پژوهشگر نهاد علمی',
        role: 'scientific',
        phone: ph,
        org: 'دانشگاه تهران',
        title: 'عضو هیئت علمی'
      };
      USERS.push(acc);
    }

    STATE.loginErr = null;
    STATE.user = {
      name: acc.id,
      role: 'scientific',
      phone: acc.phone,
      org: acc.org || 'دانشگاه تهران',
      title: acc.title || 'نهاد علمی'
    };
    save();

    location.hash = '#/scientific';
    toast(`ورود موفق؛ خوش آمدید ${acc.id}`);
    render();
  };

  if (verifyBtn) verifyBtn.onclick = verifySubmit;
  if (codeIn) {
    codeIn.onkeydown = e => { if (e.key === 'Enter') verifySubmit(); };
  }

  // Organizational login bindings
  const L = STATE.login;
  const role = el('#lg-role');
  if(role) role.onchange = e => { L.role = e.target.value; L.q = ''; L.phone = ''; STATE.loginErr = null; render(); };
  const q = el('#lg-q');
  if(q) q.oninput = e => { L.q = e.target.value; render(); setTimeout(() => { const n = el('#lg-q'); if(n) { n.focus(); n.setSelectionRange(n.value.length, n.value.length); } }, 0); };
  els('[data-pick]').forEach(b => b.onclick = () => { L.phone = b.dataset.pick; STATE.loginErr = null; render(); setTimeout(() => { const n = el('#lg-p'); if(n) n.focus(); }, 0); });
  const u = el('#lg-u'); if(u) u.oninput = e => { L.phone = e.target.value.trim(); const g = el('#lg-go'); if(g) g.disabled = !L.phone; };

  const submitOrg = () => {
    const ph = (el('#lg-u').value || '').trim(), pw = el('#lg-p').value || '';
    const acc = accountBy(ph); L.phone = ph;
    if(!acc){ STATE.loginErr = 'شماره همراه در سامانه ثبت نشده است.'; render(); return; }
    if(pw !== DEMO_PASS){ STATE.loginErr = 'رمز عبور نادرست است.'; render(); return; }
    STATE.loginErr = null;
    STATE.user = { name: acc.id, role: acc.role, phone: acc.phone, org: acc.org, title: acc.title };
    save(); location.hash = '#/'; render();
  };
  const go = el('#lg-go'); if(go) go.onclick = submitOrg;
  const pw = el('#lg-p'); if(pw) pw.onkeydown = e => { if(e.key === 'Enter') submitOrg(); };
  if(u) u.onkeydown = e => { if(e.key === 'Enter'){ const n = el('#lg-p'); if(n) n.focus(); } };
}

/* ---------- 82. requirement templates by study type ---------- */
const ROLE_LABEL={population:'جمعیت و خانوار',parcels:'پلاک و قطعات ثبتی',buildings:'سطح اشغال و ارتفاع ساختمان‌ها',
  road_network:'شبکه معابر',land_use:'کاربری اراضی مصوب',transit:'ایستگاه‌های حمل‌ونقل همگانی',
  services_edu:'مراکز و ظرفیت خدمات',terrain:'توپوگرافی و مدل ارتفاعی',trip_survey:'ماتریس سفر مبدأ-مقصد',
  parking:'عرضه پارکینگ عمومی',utilities:'شبکه آب، فاضلاب و برق'};
const MODEL_INPUTS={M01:['land_use','parcels'],M02:['parcels','buildings'],M03:['population'],
  M04:['population','trip_survey','road_network'],M05:['population','parking'],M06:['population','services_edu'],
  M07:['road_network'],M08:['population'],M09:['buildings'],M10:['population'],M11:[],M12:[]};
const TYPE_NEEDS={
 'بازنگری طرح تفصیلی':{data:['parcels','buildings','land_use','population','road_network','services_edu'],models:['M01','M02','M03','M06','M09'],inds:['IN-01','IN-02','IN-03']},
 'ظرفیت‌سنجی توسعه':{data:['parcels','buildings','population','road_network','transit','trip_survey'],models:['M02','M03','M04','M07'],inds:['IN-01','IN-04']},
 'ارزیابی اثر ترافیکی':{data:['road_network','trip_survey','parcels','parking'],models:['M04','M05','M07'],inds:['IN-04']},
 'پایش شاخص‌ها':{data:['population','services_edu','land_use'],models:['M06','M11'],inds:['IN-02','IN-03']},
 'ارزیابی مخاطره':{data:['terrain','parcels','road_network'],models:['M08','M10'],inds:['IN-05']},
 'مکان‌یابی خدمات':{data:['population','services_edu','road_network','land_use'],models:['M06','M07'],inds:['IN-03']},
 'بازنگری ضوابط':{data:['parcels','buildings','land_use'],models:['M01','M02'],inds:['IN-01']},
};
const needsOf=st=>TYPE_NEEDS[st.type]||TYPE_NEEDS['بازنگری طرح تفصیلی'];
const regionOK=(d,region)=>String(d.extent||'').includes(region)||String(d.extent||'').includes('شهر تهران');
function matchDs(role,region){
  const c=DB.datasets.filter(d=>d.role===role);
  return c.find(d=>regionOK(d,region)&&d.versions.some(v=>v.st==='published'))
      || c.find(d=>regionOK(d,region)) || null;
}
const openReq=(sid,role)=>(DB.dataRequests||[]).find(r=>r.studyId===sid&&r.role===role&&['open','in_progress'].includes(r.st));

/* ---------- 83. generated dependency inventory ---------- */
function genRows(st){
  const N=needsOf(st), out={data:[],rules:[],models:[],indicators:[],evidence:[]};
  const resolved={};
  N.data.forEach(role=>{
    const d=matchDs(role,st.region), req=openReq(st.id,role);
    const label=ROLE_LABEL[role]||role;
    let row={cat:'data',k:'d_'+role,role,t:label,sub:`نقش داده: ${role} — محدوده لازم: ${st.region}`,
      ver:'—',owner:'—',upd:'—',cov:st.region,mods:Object.keys(MODEL_INPUTS).filter(m=>N.models.includes(m)&&MODEL_INPUTS[m].includes(role)),
      act:{t:'کاتالوگ داده',h:'#/data'}};
    if(!d){
      Object.assign(row,{st:'missing',blocking:true,waivable:false,reqNeed:true,
        issue:`هیچ مجموعه داده‌ای با نقش «${role}» برای محدوده ${st.region} در کاتالوگ ثبت نشده است.`,
        impact:'ماژول‌های وابسته به این ورودی اجرا نمی‌شوند و مطالعه در فصل صفر مسدود می‌ماند.'});
    } else {
      const pub=d.versions.filter(v=>v.st==='published').slice(-1)[0], cur=dsCur(d), f=freshness(d);
      row.ds=d.code; row.ver=pub?pub.v:cur.v; row.owner=d.owner; row.upd=(pub&&pub.pub)||cur.imported; row.cov=d.extent;
      row.act={t:'مشاهده داده',h:'#/data/'+d.code};
      if(!pub){
        Object.assign(row,{st:'blocked',blocking:true,waivable:false,reqNeed:true,
          issue:`مجموعه «${d.title}» در کاتالوگ هست، اما نسخه منتشرشده‌ای ندارد (وضعیت فعلی: ${DSTAT[cur.st].t}).`,
          impact:'نسخه منتشرنشده برای انتخاب رسمی در مطالعه مجاز نیست.'});
      } else if(f.c==='b-stop'){
        Object.assign(row,{st:'stale',blocking:true,waivable:true,reqNeed:true,
          issue:`آخرین نسخه منتشرشده «${d.title}» قاعده تازگی را برآورده نمی‌کند (${f.t}).`,
          impact:'خروجی‌های وابسته با وصف «قدیمی» تولید می‌شوند و برای اجرای رسمی پذیرفته نیستند.'});
      } else if(f.c==='b-warn'||qCounts(pub).w>0){
        Object.assign(row,{st:'limited',blocking:false,waivable:true,
          issue:`نسخه منتشرشده «${d.title}» هشدار کیفیت یا تازگی دارد (${f.t}).`,
          impact:'محدودیت باید در گزارش ذکر شود؛ اجرای مطالعه مسدود نمی‌شود.'});
      } else {
        Object.assign(row,{st:'ready',blocking:false,issue:'',impact:''});
      }
      if(!canSee(d)&&CLASS_RANK[d.cls]>=2){
        Object.assign(row,{st:'no_access',blocking:false,
          issue:'طبقه‌بندی این داده محرمانه است و نقش فعلی شما اجازه مشاهده محتوای آن را ندارد.',
          impact:'وابستگی «بدون دسترسی» ثبت می‌شود و برای اجرای رسمی مجوز جداگانه لازم دارد.',
          act:{t:'درخواست دسترسی',h:'#/messages'}});
      }
    }
    if(req){ Object.assign(row,{st:'waiting',blocking:false,reqNeed:false,reqId:req.id,
      issue:row.issue+` درخواست تأمین داده با شناسه ${req.id} برای متولی داده ثبت شده است.`,
      impact:'تا پاسخ متولی داده، این وابستگی «در انتظار اقدام دیگران» می‌ماند.',
      act:{t:'پیگیری درخواست',h:'#/data/requests'}}); }
    resolved[role]=['ready','limited','no_access'].includes(row.st);
    out.data.push(row);
  });

  const pack=DB.rules.filter(r=>String(r.pack).includes(st.region));
  if(pack.length) pack.forEach(r=>out.rules.push({cat:'rules',k:'r_'+r.id,t:r.t,sub:`${r.pack} — ${r.sev==='blocking'?'مسدودکننده':'توصیه‌ای'}`,
    ver:r.v,owner:'تحلیلگر شهری',upd:r.eff,cov:st.region,mods:['M01'],act:{t:'مشاهده ضابطه',h:'#/rules'},
    st:r.st==='approved'?'ready':r.st==='pending'?'waiting':r.st==='expiring'?'stale':'needs_review',
    blocking:false,waivable:true,
    issue:r.st==='approved'?'':`وضعیت ضابطه: ${{pending:'نسخه پیشنهادی تأییدنشده',expiring:'در آستانه انقضا',conflict:'تعریف متعارض'}[r.st]}.`,
    impact:r.st==='approved'?'':'ارزیابی انطباق با نسخه تأییدشده قبلی انجام می‌شود و تفاوت باید در گزارش ذکر شود.'}));
  else out.rules.push({cat:'rules',k:'r_none',t:`بسته ضوابط ${st.region}`,sub:'بسته ضوابط منطقه‌ای',ver:'—',owner:'تحلیلگر شهری',
    upd:'—',cov:st.region,mods:['M01'],st:'missing',blocking:false,waivable:true,act:{t:'مشاهده ضوابط',h:'#/rules'},
    issue:`بسته ضوابط منطقه‌ای برای ${st.region} در کاتالوگ ثبت نشده است.`,
    impact:'کنترل انطباق M01 بدون بسته ضوابط انجام نمی‌شود.'});

  const roleOK=role=>{
    if(role in resolved) return resolved[role];
    const d=matchDs(role,st.region);
    return !!(d&&d.versions.some(v=>v.st==='published'));
  };
  N.models.forEach(mid=>{
    const m=(DB.models||[]).find(x=>x.id===mid)||{id:mid,t:MODULES[mid],v:'—',st:'active'};
    const miss=(MODEL_INPUTS[mid]||[]).filter(r=>!roleOK(r));
    const row={cat:'models',k:mid,t:`${mid} — ${MODULES[mid]}`,sub:m.st==='unavailable'?'خارج از دامنه اجرایی نسخه فعلی محصول':`نسخه مدل ${m.v} — مالک: ${m.owner||'تیم مدل'}`,
      ver:m.v,owner:m.owner||'تیم مدل',upd:'—',cov:st.region,mods:[mid],act:{t:'رجیستری مدل',h:'#/models'}};
    if(m.st==='unavailable') Object.assign(row,{st:'na',blocking:false,
      issue:`طبق مشخصات، ${mid} در این نسخه خروجی «در دسترس نیست» تولید می‌کند.`,
      impact:'اجرای مطالعه با وضعیت «ناقص» پایان می‌یابد؛ این رفتار مورد انتظار است و نقص محسوب نمی‌شود.'});
    else if(miss.length){
      const pending=miss.filter(r=>openReq(st.id,r));
      Object.assign(row,{st:pending.length===miss.length?'waiting':'blocked',
        blocking:pending.length!==miss.length,waivable:false,depRoles:miss,role:miss[0],
        reqNeed:pending.length!==miss.length&&!N.data.includes(miss[0]),
        reqId:pending.length?openReq(st.id,miss[0]).id:undefined,
        issue:`ورودی الزامی این مدل تأمین نشده است: ${miss.map(r=>ROLE_LABEL[r]||r).join('، ')}.`
          +(pending.length?' درخواست تأمین آن برای متولی داده ثبت شده است.':''),
        impact:'تا تأمین ورودی، این ماژول قابل اجرای رسمی نیست.',
        act:{t:pending.length?'پیگیری درخواست':'مشاهده وابستگی داده',h:pending.length?'#/data/requests':'#/data'}});
    }
    else Object.assign(row,{st:'ready',blocking:false,issue:'',impact:''});
    out.models.push(row);
  });

  (N.inds||[]).forEach(iid=>{
    const i=(DB.indicators||[]).find(x=>x.id===iid); if(!i) return;
    out.indicators.push({cat:'indicators',k:iid,t:i.t,sub:`واحد: ${i.unit} — مقیاس: ${i.scale} — جهت: ${i.dir}`,
      ver:i.v,owner:'تحلیلگر شهری',upd:'—',cov:st.region,mods:['M11'],act:{t:'مشاهده شاخص',h:'#/rules'},
      st:i.st==='approved'?'ready':i.st==='review'?'needs_review':'needs_review',blocking:false,waivable:true,
      issue:i.st==='approved'?'':'تعریف این شاخص هنوز اعتبارسنجی/تعیین تکلیف نشده است.',
      impact:i.st==='approved'?'':'مقدار شاخص با تعریف نسخه فعلی محاسبه و محدودیت آن ذکر می‌شود.'});
  });

  const cov=st.prog>=60?76:st.prog>=30?24:0;
  out.evidence.push({cat:'evidence',k:'e_link',t:'پیوند نتایج به نسخه ورودی‌ها',
    sub:'الزام قالب: هر ادعای کمی گزارش باید شواهد نسخه‌دار داشته باشد',ver:'—',owner:st.owner,upd:st.updated,
    cov:`${fa(cov)}٪ ادعاها`,mods:['M12'],act:{t:'گزارش‌ها',h:'#/study/'+st.id+'/reports'},
    st:cov>=80?'ready':'limited',blocking:false,waivable:true,
    issue:cov>=80?'':`${fa(100-cov)}٪ ادعاهای گزارش هنوز به نسخه داده، ضابطه یا اجرا پیوند نخورده‌اند.`,
    impact:cov>=80?'':'گزارش تا رسیدن به آستانه پوشش شواهد قالب، قابل ارسال برای بررسی نیست.'});
  out.evidence.push({cat:'evidence',k:'e_method',t:'مستندسازی روش و محدودیت‌ها',
    sub:'الزام قالب: روش هر نتیجه و محدودیت آن ثبت شود',ver:'—',owner:st.owner,upd:st.updated,cov:'—',
    mods:['M12'],act:{t:'گزارش‌ها',h:'#/study/'+st.id+'/reports'},st:'limited',blocking:false,waivable:true,
    issue:'مستندسازی روش هنوز آغاز نشده است.',impact:'بدون ثبت روش، نتایج قابل داوری کارشناسی نیستند.'});
  return out;
}

/* ---------- 84. chapter zero rows (seeded inventory or generated) ---------- */
function czRows(id){
  const def=CZ_DEF[id]; const s=czState(id); const st=byId(id);
  const finish=out=>{
    const cs=czState(id);
    const isSigned = !!(cs && (cs.signed || cs.sealed || (cs.snapshots && cs.snapshots.length > 0)));
    const stObj = byId(id);
    const isLocked = isStudyLocked(id);
    const sc = (window.DB?.studyCases || []).find(c => c.study_id === id);
    const isCaseReady = sc && (sc.status === 'READY_FOR_NEXT_STEP' || sc.status === 'COMPLETED');

    if(isSigned || isLocked || isCaseReady){
      CZ_CATS.forEach(([c])=>out[c].forEach(r=>{
        r.blocking = false;
        if(r.st === 'blocked' || r.st === 'missing' || r.st === 'stale'){
          r.st = 'ready';
        }
      }));
    } else {
      const flat={}; CZ_CATS.forEach(([c])=>out[c].forEach(r=>flat[c+':'+r.k]=r));
      CZ_CATS.forEach(([c])=>out[c].forEach(r=>{
        if(r.dep && flat[r.dep] && !flat[r.dep].blocking && r.blocking){
          r.blocking=false; r.st='limited';
          r.impact=r.impact+' محدودیت ورودی بالادست مستند شده است؛ خروجی با وصف «موقت» تولید می‌شود.';
        }
      }));
    }
    return out;
  };
  if(def){
    const out={};
    CZ_CATS.forEach(([c])=>out[c]=(def[c]||[]).map(r=>{
      const row={...r,cat:c};
      if(row.restricted && !canSee({cls:'confidential'})) { row.st='no_access'; row.blocking=false;
        row.issue='طبقه‌بندی این داده «محرمانه» است و نقش فعلی شما اجازه مشاهده محتوای آن را ندارد.';
        row.impact='وابستگی به‌صورت «بدون دسترسی» ثبت می‌شود و برای اجرای رسمی نیازمند مجوز جداگانه است.';
        row.act={t:'درخواست دسترسی',h:'#/admin'}; }
      if(s.over[c+':'+row.k]) Object.assign(row,s.over[c+':'+row.k]);
      return row;
    }));
    return finish(out);
  }
  if(!st) { const e={}; CZ_CATS.forEach(([c])=>e[c]=[]); return e; }
  const out=genRows(st);
  CZ_CATS.forEach(([c])=>out[c]=out[c].map(r=>{
    if(s.over[c+':'+r.k]) Object.assign(r,s.over[c+':'+r.k]);
    return r;
  }));
  return finish(out);
}

/* ---------- 85. data request workflow ---------- */
const DREQ_ST={open:{t:'در انتظار پاسخ',c:'b-warn'},in_progress:{t:'در حال تأمین',c:'b-run'},
  fulfilled:{t:'تأمین شد',c:'b-ok'},rejected:{t:'رد شد',c:'b-stop'}};
window.DREQ_ST = DREQ_ST;
function requestData(studyId,row){
  const st=byId(studyId);
  const role=row.role||(row.depRoles&&row.depRoles[0])||'data';
  const label=ROLE_LABEL[role]||row.t;
  const steward=usersByRole('steward')[0];
  const r={id:nid('DR'),studyId,role,label,by:ME(),to:steward,tm:clock(),st:'open',
    reason:row.issue||'تأمین ورودی الزامی فصل صفر',need:row.t,region:st.region};
  DB.dataRequests=DB.dataRequests||[]; DB.dataRequests.unshift(r);
  DB.tasks.unshift({id:nid('TS'),t:`تأمین داده «${label}» برای ${st.name}`,studyId,assignee:steward,st:'todo',due:'۱۴۰۵/۰۷/۱۰'});
  logAct({action:'REQUEST_DATA',et:'study',eid:studyId,etitle:st.name,to:'open',
    text:`درخواست تأمین داده «${label}» (${r.id}) برای متولی داده ثبت شد`,k:'warn'});
  notify({to:steward,type:'warn',title:'درخواست تأمین داده برای یک مطالعه ثبت شد',
    msg:`${label} — ${st.name} (${st.region})`,route:'#/data/requests',et:'study',eid:studyId});
  saveDB(); return r;
}
function fulfillRequest(reqId,opt){
  const r=DB.dataRequests.find(x=>x.id===reqId); if(!r) return;
  const st=byId(r.studyId);
  let d=opt.dsCode?ds(opt.dsCode):null;
  if(!d){
    const code=(r.role.toUpperCase().slice(0,8).replace(/_/g,'-'))+'-'+fa(DB.datasets.length+1).replace(/[۰-۹]/g,x=>'۰۱۲۳۴۵۶۷۸۹'.indexOf(x));
    d={code,title:`${r.label} — ${r.region}`,kind:'tabular',role:r.role,owner:ME(),
      org:'تأمین‌شده به درخواست مطالعه (نمونه)',cls:'restricted_municipal',
      desc:`مجموعه داده تأمین‌شده در پاسخ به درخواست ${r.id} برای ${st?st.name:r.studyId}. مقادیر ساختگی است.`,
      extent:r.region,crs:'EPSG:32639',
      schema:[['record_id','string','—',1,'شناسه رکورد','شناسه'],['value','decimal(12,2)','—',1,'مقدار شاخص پایه',''],
        ['observed_at','date','—',1,'تاریخ مشاهده','']],
      versions:[{v:1,st:'published',rows:1280,counts:[1290,1280,10,0],obs:'۱۴۰۵/۰۵',imported:NOW,pub:NOW,
        reason:`تأمین به درخواست ${r.id}`,
        checks:[chk('REQUIRED_FIELDS','pass',0,1290,'۰٪','فیلدهای الزامی کامل است.','—','—'),
                chk('DUPLICATES','warning',10,1290,'حداکثر ۱٪','۱۰ رکورد تکراری رد شد.','۱۰ رکورد در نسخه نهایی نیستند.','بررسی فهرست ردشده.'),
                chk('TEMPORAL_COVERAGE','pass',0,1280,'حداکثر ۳۶ ماه','تاریخ مشاهده در دوره مجاز است.','—','—')]}],
      issues:[],uses:[r.studyId]};
    DB.datasets.push(d);
    logAct({action:'CREATE_DATASET',et:'dataset',eid:d.code,etitle:d.title,to:'published',
      text:`مجموعه داده «${d.title}» ثبت و نسخه v۱ آن منتشر شد (پاسخ به ${r.id})`,k:'ok'});
  } else {
    const pub=d.versions.filter(v=>v.st==='published').slice(-1)[0];
    if(!pub){ const cand=d.versions.slice(-1)[0]; cand.st='published'; cand.pub=NOW;
      logAct({action:'PUBLISH_DATASET_VERSION',et:'dataset',eid:d.code,etitle:d.title,to:'published',
        text:`نسخه v${fa(cand.v)} داده «${d.title}» در پاسخ به ${r.id} منتشر شد`,k:'ok'}); }
    if(!d.uses.includes(r.studyId)) d.uses.push(r.studyId);
    if(!regionOK(d,r.region)) d.extent=d.extent+' + '+r.region;
    if(freshness(d).c==='b-stop'){
      d.versions.filter(v=>v.st==='published').forEach(v=>{v.st='superseded';});
      const nv={v:(d.versions.slice(-1)[0].v||0)+1,st:'published',rows:1280,counts:[1290,1280,10,0],
        obs:'۱۴۰۵/۰۵',imported:NOW,pub:NOW,reason:`به‌روزرسانی برای رفع کهنگی به درخواست ${r.id}`,
        checks:[chk('REQUIRED_FIELDS','pass',0,1290,'۰٪','فیلدهای الزامی کامل است.','—','—'),
                chk('DUPLICATES','warning',10,1290,'حداکثر ۱٪','۱۰ رکورد تکراری رد شد.','۱۰ رکورد در نسخه نهایی نیستند.','بررسی فهرست ردشده.'),
                chk('TEMPORAL_COVERAGE','pass',0,1280,'حداکثر ۳۶ ماه','تاریخ مشاهده ۱۴۰۵/۰۵ در دوره مجاز است.','—','—')]};
      d.versions.push(nv);
      logAct({action:'PUBLISH_DATASET_VERSION',et:'dataset',eid:d.code,etitle:d.title,from:'superseded',to:'published',
        text:`نسخه تازه v${fa(nv.v)} داده «${d.title}» برای رفع کهنگی منتشر شد (پاسخ به ${r.id})`,k:'ok'});
    }
  }
  r.st='fulfilled'; r.dsCode=d.code; r.doneBy=ME(); r.doneTm=clock(); r.note=opt.note||'';
  if(st){ st.dsUsed=st.dsUsed||[]; if(!st.dsUsed.includes(d.code)) st.dsUsed.push(d.code); }
  const sc = (window.DB?.studyCases || []).find(c => c.study_id === r.studyId);
  if(sc && window.syncStudyCaseWithChapterZero) {
    window.syncStudyCaseWithChapterZero(sc.id);
  }
  DB.tasks.filter(t=>t.studyId===r.studyId&&t.assignee===r.to&&t.t.includes(r.label)).forEach(t=>t.st='done');
  logAct({action:'FULFILL_DATA_REQUEST',et:'study',eid:r.studyId,etitle:st?st.name:r.studyId,from:'open',to:'fulfilled',
    text:`درخواست ${r.id} با مجموعه «${d.title}» تأمین شد و به مطالعه متصل گردید`,k:'ok'});
  notify({to:r.by,type:'ok',title:'درخواست داده شما تأمین شد',
    msg:`${r.label} → ${d.title}`,route:'#/study/'+r.studyId+'/chapter0',et:'study',eid:r.studyId});
  saveDB();
}
function rejectRequest(reqId,note){
  const r=DB.dataRequests.find(x=>x.id===reqId); if(!r) return;
  r.st='rejected'; r.note=note; r.doneBy=ME(); r.doneTm=clock();
  const st=byId(r.studyId);
  logAct({action:'REJECT_DATA_REQUEST',et:'study',eid:r.studyId,etitle:st?st.name:r.studyId,from:'open',to:'rejected',
    text:`درخواست ${r.id} رد شد: ${note}`,k:'stop'});
  notify({to:r.by,type:'stop',title:'درخواست داده شما رد شد',msg:note,
    route:'#/study/'+r.studyId+'/chapter0',et:'study',eid:r.studyId});
  saveDB();
}

/* ---------- 87. study ageing ---------- */
const DAY=86400000;
function ageOf(s){
  if(!s.createdTs) return null;
  return Math.max(0,Math.floor((Date.now()-s.createdTs)/DAY));
}
function AgeBar(s){
  const a=ageOf(s); if(a===null) return '<span class="muted">—</span>';
  const band=a<7?['تازه','age-new']:a<30?['جاری','age-mid']:a<90?['طولانی','age-long']:['کهنه','age-old'];
  const w=Math.min(100,Math.round(a/90*100));
  return `<div class="agewrap" title="${fa(a)} روز از ایجاد مطالعه گذشته است">
    <div class="agebar ${band[1]}"><i style="width:${Math.max(6,w)}%"></i></div>
    <span class="agelbl">${a===0?'امروز':fa(a)+' روز'} · ${band[0]}</span></div>`;
}

const bindRows=()=>els('tr[data-href]').forEach(tr=>tr.onclick=e=>{if(e.target.closest('[data-stop]'))return; go(tr.dataset.href);});
function route(){
  const h=location.hash||'#/';
  if(!STATE.user) return {p:LoginPage(),b:bindLogin};
  if(h.startsWith('#/scientific') && window.handleScientificRoute) return window.handleScientificRoute(h);
  if(h.startsWith('#/analyst/scientific-proposals') && window.AnalystScientificProposalsPage) return {p:window.AnalystScientificProposalsPage(),b:window.bindAnalystScientificProposals};
  if(h.startsWith('#/study-case/') && window.handleStudyCaseRoute) return window.handleStudyCaseRoute(h);
  if((h === '#/study-cases' || h.startsWith('#/study-cases?')) && window.handleStudyCaseRoute) return window.handleStudyCaseRoute(h);
  if(h.startsWith('#/studies')){
    if(!can('VIEW_STUDY')&&!can('VIEW_ASSIGNED_STUDY')) return {p:Denied('مطالعات','فهرست مطالعات در حوزه مسئولیت نقش شما نیست.')};
    if(h.startsWith('#/studies/new')&&!can('CREATE_STUDY')) return {p:Denied('ایجاد مطالعه','ایجاد مطالعه در اختیار تحلیلگر شهری است.')};
    return h.startsWith('#/studies/new')?{p:NewStudy(),b:bindWizard}:{p:StudiesPage(),b:bindStudies};
  }
  if(h.startsWith('#/messages')) return {p:MessagesPage(),b:bindMessages};
  if(h.startsWith('#/cases')) return {p:CasesPage(),b:bindCases};
  if(h.startsWith('#/users')) return {p:UsersPage(),b:bindRows};
  if(h.startsWith('#/orgs')) return {p:OrgsPage(),b:bindRows};
  if(h.startsWith('#/perms')) return {p:PermsPage(),b:bindHome};
  if(h.startsWith('#/settings')) return {p:SettingsPage(),b:bindAdmin};
  if(h.startsWith('#/health')) return {p:HealthPage(),b:bindRows};
  if(h.startsWith('#/models')) return {p:ModelsPage(),b:bindRows};
  if(h.startsWith('#/runs')) return {p:RunsPage(),b:bindRows};
  if(h.startsWith('#/rules')) return {p:RulesPage(),b:bindRules};
  if(h.startsWith('#/findings')) return {p:FindingsPage(),b:bindHome};
  if(h.startsWith('#/decisions')) return {p:DecisionsPage(),b:bindRows};
  if(h.startsWith('#/review')) return {p:ReviewPage(),b:bindRows};
  if(h.startsWith('#/audit')) return {p:AuditPage()};
  if(h.startsWith('#/admin')) return {p:PermsPage(),b:bindHome};
  if(h.startsWith('#/proposals')){
    if(!can('VIEW_PROPOSAL')) return {p:Denied('پیشنهادها','فهرست پیشنهادها در حوزه مسئولیت نقش شما نیست.')};
    if(h.startsWith('#/proposals/new')){
      if(!can('CREATE_PROPOSAL')) return {p:Denied('ثبت پیشنهاد','ثبت پیشنهاد در اختیار کارشناس تحلیل شهری است.')};
      return {p:NewProposal(),b:bindNewProposal};
    }
    return {p:ProposalsPage(),b:bindProposals};
  }
  const pm=h.match(/^#\/proposal\/([^/]+)(?:\/([^/?]+))?/);
  if(pm){
    if(prop(pm[1])&&!canOpenProposal(pm[1]))
      return {p:Denied('پیشنهاد','این پیشنهاد در حوزه مسئولیت یا ارجاع شما نیست.','بازبین فقط بسته‌های ارجاع‌شده به خود و مقام تصمیم‌گیر فقط پرونده‌های آماده تصمیم را می‌بیند.')};
    return ProposalRoute(pm[1],pm[2]||'');
  }
  const m=h.match(/^#\/study\/([^/]+)(?:\/([^/?]+))?/);
  if(m){
    if(byId(m[1])&&!canOpenStudy(m[1]))
      return {p:Denied('مطالعه','این مطالعه به شما یا دفتر شما ارجاع نشده است.','دسترسی مشاور بر پایه ارجاع مطالعه است، نه دسترسی سراسری.')};
    if(m[2]==='chapter0') return {p:StudyPage(m[1],'chapter0'),b:()=>bindStudyPage(m[1],'chapter0')};
    return {p:StudyPage(m[1],m[2]||'overview'),b:()=>bindStudyPage(m[1],m[2]||'overview')};
  }
  if(h.startsWith('#/data')){
    if(!can('VIEW_DATA')) return {p:Denied('کاتالوگ داده','مشاهده و مدیریت کاتالوگ داده در حوزه مسئولیت متولی داده و نقش‌های تحلیلی است.','در میز تصمیم، خلاصه و شواهد نسخه‌دار همان داده در اختیار شماست.')};
    const seg=h.slice(1).split('?')[0].split('/').filter(Boolean).slice(1);
    if(seg[0]==='requests') return {p:DataRequestsPage(),b:bindDataRequests};
    if(seg[0]==='ingest'&&!can('MANAGE_DATA')) return {p:Denied('بارگذاری نسخه داده','بارگذاری، نگاشت، اعتبارسنجی و انتشار نسخه داده تنها در اختیار متولی داده است.')};
    if(!seg.length) return {p:CatalogPage(),b:bindCatalog};
    if(seg[0]==='ingest') return {p:IngestPage(),b:bindIngest};
    if(seg[0]==='queue') return {p:QueuePage(),b:bindRows};
    if(seg[0]==='quarantine') return {p:QuarantinePage(),b:()=>{bindRows();
      els('[data-fix]').forEach(b=>b.onclick=()=>{STATE.ingest.step=0;STATE.ingest.stage=-1;go('#/data/ingest');
        toast('نامزد اصلاح‌شده تازه ساخته می‌شود؛ بارگذاری اصلی دست‌نخورده می‌ماند');});}};
    if(seg[0]==='issues') return {p:IssuesPage(),b:bindRows};
    const code=seg[0];
    if(seg[1]==='compare') return {p:ComparePage(code,+seg[2],+seg[3]),b:bindRows};
    return {p:DatasetPage(code,seg[1]||'overview'),b:()=>{bindRows();bindDataset(code);}};
  }
  const base='#'+h.slice(1).split('?')[0].replace(/\/$/,'');
  if(SECTION_META[base]) return {p:SectionPage(base)};
  return roleHome();
}
